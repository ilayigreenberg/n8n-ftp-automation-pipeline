services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    ports:
      - "5678:5678"
    volumes:
      - ./n8n-data:/home/node/.n8n
    restart: always
    networks:
      - automation_net

  ftp_server:
    image: fauria/vsftpd
    ports:
      - "20-21:20-21"
      - "21100-21110:21100-21110"
    environment:
      - FTP_USER=ilayi
      - FTP_PASS=password123
      - PASV_ADDRESS=127.0.0.1
      - PASV_MIN_PORT=21100
      - PASV_MAX_PORT=21110
    volumes:
      - ./ftp-data:/home/vsftpd
    restart: always
    networks:
      - automation_net

networks:
  automation_net:
    driver: bridge
